---
# Shared custom credential types managed by the platform team.
# These are available to all organizations.
controller_credential_types_all:
  # The built-in "Red Hat Ansible Automation Platform" type only injects
  # CONTROLLER_* env vars, but ansible.platform modules (used by dispatch
  # for gateway_teams, gateway_organizations, etc.) need AAP_* env vars.
  # This custom type injects both sets so dispatch works end-to-end.
  - name: "AAP CaC Credential"
    description: "Injects both CONTROLLER_* and AAP_* env vars for full dispatch compatibility"
    kind: cloud
    inputs:
      fields:
        - id: host
          type: string
          label: "AAP Gateway URL"
        - id: username
          type: string
          label: "Username"
        - id: password
          type: string
          label: "Password"
          secret: true
        - id: verify_ssl
          type: boolean
          label: "Verify SSL"
      required:
        - host
        - username
        - password
    injectors:
      env:
        CONTROLLER_HOST: "{{ '{{' }} host {{ '}}' }}"
        CONTROLLER_USERNAME: "{{ '{{' }} username {{ '}}' }}"
        CONTROLLER_PASSWORD: "{{ '{{' }} password {{ '}}' }}"
        CONTROLLER_VERIFY_SSL: "{{ '{{' }} verify_ssl {{ '}}' }}"
        AAP_HOSTNAME: "{{ '{{' }} host {{ '}}' }}"
        AAP_USERNAME: "{{ '{{' }} username {{ '}}' }}"
        AAP_PASSWORD: "{{ '{{' }} password {{ '}}' }}"
        AAP_VALIDATE_CERTS: "{{ '{{' }} verify_ssl {{ '}}' }}"
      extra_vars:
        aap_hostname: "{{ '{{' }} host {{ '}}' }}"
        aap_username: "{{ '{{' }} username {{ '}}' }}"
        aap_password: "{{ '{{' }} password {{ '}}' }}"
        aap_validate_certs: "{{ '{{' }} verify_ssl {{ '}}' }}"
        _cred_injected: "true"
    state: present

  - name: "Platform Secrets"
    description: "Platform-specific secrets injected as extra_vars (extensible)"
    kind: cloud
    inputs:
      fields:
        - id: redhat_api_token
          type: string
          label: "Red Hat API Token (console.redhat.com)"
          secret: true
      required:
        - redhat_api_token
    injectors:
      extra_vars:
        redhat_api_token: "{{ '{{' }} redhat_api_token {{ '}}' }}"
    state: present
...
