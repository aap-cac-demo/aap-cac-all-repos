---
# Role assignments for operator teams.
# Admin roles (System Administrator, Organization Admin) are granted via
# authenticator maps -- not team role assignments -- because the AAP 2.7
# Gateway API blocks assigning global roles and Organization Member
# permissions to teams.
gateway_role_team_assignments_all:
  - team: platform-operators
    role_definition: Organization Execute
    assignment_objects:
      - name: Platform
        type: organizations
    state: present

