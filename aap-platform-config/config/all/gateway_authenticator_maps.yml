---
# LDAP group-to-role/team mappings
# Platform mappings are defined here.
# Team-specific mappings are generated by team_onboarding.yml from team_definitions/*.yml.
#
# Admin roles use authenticator maps (is_superuser / map_type: organization)
# because the AAP 2.7 Gateway API blocks assigning global roles and
# Organization Member permissions to teams via role_team_assignment.
gateway_authenticator_maps_all:
  # Allow access to aap group member ONLY. Deny is enforced by `revoke: true
  - name: platform-access-map
    authenticator: corporate-ldap
    map_type: allow
    triggers:
      groups:
        has_or:
          - "cn=aap,ou=groups,dc=example,dc=com"
    order: 0
    revoke: true
    state: present
  # Super user mapping (system admin)
  - name: platform-superuser-map
    authenticator: corporate-ldap
    map_type: is_superuser
    revoke: true
    triggers:
      groups:
        has_or:
          - "cn=aap-platform-admins,ou=groups,dc=example,dc=com"
    order: 1
    state: present
  # Platform-operators team mapping
  - name: platform-operators-map
    authenticator: corporate-ldap
    map_type: team
    triggers:
      groups:
        has_or:
          - "cn=aap-platform-operators,ou=groups,dc=example,dc=com"
    organization: Platform
    team: platform-operators
    role: "Team Member"
    order: 2
    state: present

  # Team-specific authenticator maps are generated dynamically.
  # Example (generated by team_onboarding.yml):
  # - name: team-alpha-admins-map
  #   authenticator: corporate-ldap
  #   map_type: organization
  #   organization: Team-Alpha
  #   role: "Organization Admin"
  #   triggers:
  #     groups:
  #       has_or:
  #         - "aap-team-alpha-admins"
  #   state: present
  # - name: team-alpha-operators-map
  #   authenticator: corporate-ldap
  #   map_type: team
  #   triggers:
  #     groups:
  #       has_or:
  #         - "aap-team-alpha-operators"
  #   organization: Team-Alpha
  #   team: team-alpha-operators
  #   role: "Team Member"
  #   order: 10
  #   state: present
...
