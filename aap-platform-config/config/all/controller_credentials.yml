---
# Platform-managed credentials.
# Includes SCM credentials for team CaC repos and gateway tokens.
# Team-specific credentials are generated by team_onboarding.yml.
controller_credentials_all:
  - name: scm-github
    description: "GitHub SCM credential for CaC project sync"
    organization: Platform
    credential_type: "Source Control"
    inputs:
      username: "{{ github_username }}"
      password: "{{ github_token }}"
    state: present

  - name: platform-gateway-cred
    description: "AAP gateway credential for platform JT execution"
    organization: Platform
    credential_type: "AAP CaC Credential"
    inputs:
      host: "{{ aap_hostname }}"
      username: "{{ aap_username }}"
      password: "{{ aap_password }}"
      verify_ssl: "{{ aap_validate_certs }}"
    state: present

  - name: platform-secrets
    description: "Platform secrets for scheduled JTs"
    organization: Platform
    credential_type: "Platform Secrets"
    inputs:
      redhat_api_token: "{{ redhat_api_token }}"
    state: present

# Hub Galaxy credentials (hub-galaxy-rh-certified, hub-galaxy-validated,
# hub-galaxy-published) are managed by _hub_galaxy_credential_tasks.yml,
# not by dispatch, because the token is ephemeral and only available at
# creation time.
