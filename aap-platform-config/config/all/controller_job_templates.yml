---
# Platform-managed job templates.
# Team-specific CaC job templates are generated by team_onboarding.yml.
controller_templates_all:
  - name: "Refresh Hub Galaxy Token"
    organization: Platform
    project: aap-platform-config
    playbook: "playbooks/refresh_hub_galaxy_token.yml"
    inventory: cac-localhost
    execution_environment: "ee-supported"
    extra_vars:
      env: "{{ env }}"
    credentials:
      - platform-gateway-cred
    state: present

  - name: "Sync Hub Collections"
    description: "Sync upstream collection remotes (rh-certified, validated, community) without running full dispatch"
    organization: Platform
    project: aap-platform-config
    playbook: "playbooks/sync_hub_collections.yml"
    inventory: cac-localhost
    execution_environment: "ee-supported"
    extra_vars:
      env: "{{ env }}"
    credentials:
      - platform-gateway-cred
      - platform-secrets
    # Optional: pass hub_sync_remotes as a survey or extra var to sync
    # a subset of remotes (e.g., '["community"]').
    state: present

  # Team CaC JTs are generated by team_onboarding.yml from team_definitions/*.yml.
  # Example:
  # - name: "team-alpha - Apply Team Config"
  #   description: "Apply Configuration as Code for Team Alpha"
  #   organization: "Team-Alpha"
  #   project: "team-alpha-cac"
  #   playbook: "playbooks/apply_team_config.yml"
  #   inventory: "team-alpha-cac-localhost"
  #   execution_environment: "ee-supported"
  #   state: present

controller_schedules_all:
  - name: "Refresh Hub Galaxy Token - Scheduled"
    unified_job_template: "Refresh Hub Galaxy Token"
    rrule: >-
      DTSTART:20260101T000000Z
      RRULE:FREQ=HOURLY;INTERVAL={{
        ((hub_galaxy_token_expire_seconds | int) *
         (hub_galaxy_token_refresh_buffer | float) / 3600)
        | int | default(6, true)
      }}
    enabled: true
    state: present
...
