---
- name: Offboard an organization from AAP
  hosts: all
  connection: local
  gather_facts: false
  vars:
    offboard_allow_missing_org: false
  module_defaults:
    group/ansible.platform.gateway:
      aap_hostname: "{{ aap_hostname }}"
      aap_username: "{{ aap_username }}"
      aap_password: "{{ aap_password }}"
      aap_validate_certs: "{{ aap_validate_certs }}"
    ansible.controller.credential:
      controller_host: "{{ aap_hostname }}"
      controller_username: "{{ aap_username }}"
      controller_password: "{{ aap_password }}"
      validate_certs: "{{ aap_validate_certs }}"
    ansible.builtin.uri:
      user: "{{ aap_username }}"
      password: "{{ aap_password }}"
      force_basic_auth: true
      validate_certs: "{{ aap_validate_certs }}"
  tasks:
    - name: Include env secrets
      ansible.builtin.include_vars:
        dir: "../config/{{ env }}"
        extensions: ['yml']
      when: not (_cred_injected | default(false) | bool)

    - name: Validate offboarding request
      ansible.builtin.assert:
        that:
          - org_display_name | default('') | trim | length > 0
          - org_display_name != 'Default'
        fail_msg: "Provide org_display_name. Default is protected."

    - name: Look up the organization
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/gateway/v1/organizations/?name={{ org_display_name | urlencode }}"
        status_code: 200
      register: _offboard_org

    - name: Stop when an already-absent organization is allowed
      ansible.builtin.meta: end_play
      when:
        - _offboard_org.json.count == 0
        - offboard_allow_missing_org | bool

    - name: Require exactly one organization
      ansible.builtin.assert:
        that: _offboard_org.json.count == 1
        fail_msg: "Expected one organization named '{{ org_display_name }}'; found {{ _offboard_org.json.count }}."

    # The onboarding definition identifies the global objects that org deletion leaves behind.
    - name: Initialize onboarding lookup
      ansible.builtin.set_fact:
        _offboard_definitions: []
        _offboard_fetched: {}

    - name: Find the onboarding definition
      ansible.builtin.set_fact:
        _offboard_definitions: "{{ _offboard_definitions + [_definition] }}"
      vars:
        _definition: "{{ lookup('ansible.builtin.file', item) | from_yaml }}"
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../team_definitions/*.yml') }}"
      when: _definition.org_display_name | default('') == org_display_name
      loop_control:
        label: "{{ item | basename }}"

    - name: Require one onboarding definition
      ansible.builtin.assert:
        that:
          - _offboard_definitions | length == 1
          - (_offboard_definitions | first | default({})).team_name | default('') | length > 0
        fail_msg: "Keep exactly one matching onboarding definition until offboarding is complete."

    - name: Set onboarding identity
      ansible.builtin.set_fact:
        _offboard_team: "{{ _offboard_definitions | first }}"

    - name: Check for role assignment files referencing the onboarding team
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../role_assignments"
        patterns: "*{{ _offboard_team.team_name }}*"
        file_type: file
      register: _offboard_role_files

    - name: Warn about stale role assignment files
      ansible.builtin.debug:
        msg: >-
          The following role assignment files reference the offboarded team and
          should be removed via PR:
          {{ _offboard_role_files.files | map(attribute='path') | map('basename') | list | join(', ') }}
      when: _offboard_role_files.matched > 0

    - name: Look up the Controller organization
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/organizations/?name={{ org_display_name | urlencode }}"
        status_code: 200
      register: _offboard_controller_org

    - name: Require one matching Controller organization
      ansible.builtin.assert:
        that: _offboard_controller_org.json.count == 1
        fail_msg: "Controller organization is missing or ambiguous; no resources have been deleted."

    # These survive org deletion. Their schedules and workflow nodes cascade with them.
    - name: Discover Controller resources requiring explicit deletion
      ansible.builtin.include_tasks: _offboard_fetch.yml
      vars:
        _fetch_label: "{{ item }}"
        _fetch_key: "{{ item }}"
        _fetch_url: >-
          {{ aap_hostname }}/api/controller/v2/{{ item }}/?organization={{ _offboard_controller_org.json.results[0].id }}
      loop: [workflow_job_templates, job_templates, projects]

    - name: Collect Controller delete candidates
      ansible.builtin.set_fact:
        _offboard_resources: >-
          {{ _offboard_fetched.workflow_job_templates
             + _offboard_fetched.job_templates + _offboard_fetched.projects }}

    - name: Verify Controller resource ownership
      ansible.builtin.assert:
        that: item.summary_fields.organization.id | int == _offboard_controller_org.json.results[0].id | int
        fail_msg: "Ownership check failed for {{ item.name }}."
      loop: "{{ _offboard_resources }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Delete workflows, job templates, then projects
      ansible.builtin.include_tasks: _offboard_delete.yml
      loop: "{{ _offboard_resources }}"
      loop_control:
        loop_var: _offboard_object
        label: "{{ _offboard_object.name }}"

    - name: Remove onboarding authenticator maps
      ansible.platform.authenticator_map:
        name: "{{ item }}-map"
        authenticator: corporate-ldap
        state: absent
      loop: >-
        {{ [_offboard_team.team_name ~ '-admins', _offboard_team.team_name ~ '-operators']
           + (_offboard_team.custom_teams | default([])
              | selectattr('ldap_group', 'defined') | map(attribute='name') | list) }}

    - name: Remove the dedicated Platform gateway credential
      ansible.controller.credential:
        name: "{{ _offboard_team.team_name }}-gateway-cred"
        organization: Platform
        credential_type: AAP CaC Credential
        state: absent

    - name: Remove the dedicated CaC service account
      ansible.platform.user:
        username: "svc-{{ _offboard_team.team_name }}-cac"
        state: absent

    - name: Delete the organization and its remaining resources
      ansible.platform.organization:
        name: "{{ org_display_name }}"
        state: absent

    - name: Wait for organization deletion in Gateway and Controller
      ansible.builtin.uri:
        url: "{{ aap_hostname }}{{ item }}"
        status_code: [200, 202, 404]
      register: _offboard_removed
      until: _offboard_removed.status == 404
      retries: 30
      delay: 2
      loop:
        - "{{ _offboard_org.json.results[0].url }}"
        - "{{ _offboard_controller_org.json.results[0].url }}"
