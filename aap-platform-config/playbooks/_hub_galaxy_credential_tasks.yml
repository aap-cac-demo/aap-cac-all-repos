---
# Shared tasks: manage the Hub Galaxy token and credentials.
# Included by apply_config.yml and refresh_hub_galaxy_token.yml.
#
# Requires: aap_hostname, aap_username, aap_password, aap_validate_certs
# Optional: hub_galaxy_token_force_refresh (default: false)
# Provides: hub_api_token (fact, only when token is created/refreshed)

# --- Pre-flight: ensure Platform org exists (needed on fresh installs) ---

- name: Ensure Platform organization exists
  ansible.platform.organization:
    name: Platform
    state: present
    aap_hostname: "{{ aap_hostname }}"
    aap_username: "{{ aap_username }}"
    aap_password: "{{ aap_password }}"
    aap_validate_certs: "{{ aap_validate_certs }}"

# --- Gate: skip if credentials already exist and refresh is not forced ---

- name: Check if Hub Galaxy credentials already exist
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/controller/v2/credentials/?name=hub-galaxy-rh-certified&organization__name=Platform"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
  register: _hub_cred_check
  when: not (hub_galaxy_token_force_refresh | default(false) | bool)

- name: Set token needed fact
  ansible.builtin.set_fact:
    _hub_token_needed: >-
      {{ (hub_galaxy_token_force_refresh | default(false) | bool) or
         (_hub_cred_check.json.count | default(0) | int == 0) }}

# --- Token revoke + create (only when needed) ---

- name: List existing CaC Hub Galaxy tokens
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/gateway/v1/tokens/"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
  register: _existing_tokens
  no_log: true
  when: _hub_token_needed

- name: Revoke stale CaC Hub Galaxy tokens
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/gateway/v1/tokens/{{ item.id }}/"
    method: DELETE
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    status_code: [204, 404]
  loop: >-
    {{ _existing_tokens.json.results |
       selectattr('description', 'equalto', 'CaC Hub Galaxy credential') |
       list }}
  loop_control:
    label: "token {{ item.id }}"
  no_log: true
  when: _hub_token_needed

- name: Create fresh gateway token for Hub Galaxy credentials
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/gateway/v1/tokens/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    body_format: json
    body:
      description: "CaC Hub Galaxy credential"
      scope: "read"
    status_code: [200, 201]
  register: _gateway_token_response
  no_log: true
  when: _hub_token_needed

- name: Set Hub token fact
  ansible.builtin.set_fact:
    hub_api_token: "{{ _gateway_token_response.json.token }}"
  no_log: true
  when: _hub_token_needed

# --- Credential create / update (only when needed) ---

- name: Ensure Hub Galaxy credentials exist
  ansible.controller.credential:
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    organization: Platform
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      url: "{{ aap_hostname }}/api/galaxy/content/{{ item.repo }}/"
      token: "{{ hub_api_token }}"
    state: present
    controller_host: "{{ aap_hostname }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: "{{ aap_validate_certs }}"
  no_log: true
  loop:
    - name: hub-galaxy-rh-certified
      repo: rh-certified
      description: "Hub Galaxy credential -- rh-certified collections"
    - name: hub-galaxy-validated
      repo: validated
      description: "Hub Galaxy credential -- validated collections"
    - name: hub-galaxy-published
      repo: published
      description: "Hub Galaxy credential -- published collections"
  loop_control:
    label: "{{ item.name }}"
  when: _hub_token_needed
