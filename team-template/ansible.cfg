[defaults]
collections_path = ./collections

[galaxy]
server_list = hub_rh_certified, hub_validated, hub_published

[galaxy_server.hub_rh_certified]
url=https://aap-aap27.apps-crc.testing/api/galaxy/content/rh-certified/
validate_certs=false

[galaxy_server.hub_validated]
url=https://aap-aap27.apps-crc.testing/api/galaxy/content/validated/
validate_certs=false

[galaxy_server.hub_published]
url=https://aap-aap27.apps-crc.testing/api/galaxy/content/published/
validate_certs=false
# Auth via env vars (do not commit credentials):
#   export ANSIBLE_GALAXY_SERVER_HUB_RH_CERTIFIED_USERNAME="admin"
#   export ANSIBLE_GALAXY_SERVER_HUB_RH_CERTIFIED_PASSWORD="xxx"
#   (same pattern for HUB_VALIDATED and HUB_PUBLISHED)
# Teams: update the URLs above to match your environment's AAP gateway.
